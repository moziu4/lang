[package]
name = "lang_dto"
version = "0.1.0"
edition = "2024"

[dependencies]
warp = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
mongodb = "3.1.0"
tracing = "0.1"
dotenv = "0.15"
actix-web = "4.9.0"
actix-cors = "0.7.0"
async-trait = "0.1.82"
env_logger = "0.11.5"
serde_json = "1.0.128"
redis = { version = "0.28.1", features = ["tokio-comp"] }
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.31"
async-nats = { version = "=0.35.1", default-features = false, features = ["ring"] }
derive_more = { version = "1.0.0", features = ["deref", "into", "is_variant"]}
